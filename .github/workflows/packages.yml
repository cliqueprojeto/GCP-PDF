name: Instaladores Linux e macOS
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release existente que receberá os instaladores
        required: true
        default: v0.3.7
permissions:
  contents: read
concurrency:
  group: packages-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências de empacotamento Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb desktop-file-utils libgbm1 libnss3 libasound2 libgtk-3-0
      - run: npm ci
      - run: npm run prepare:native
      - name: Versão e arquitetura
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if (`v${p.version}` !== process.env.RELEASE_TAG || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Formulários e troca de documentos
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a node scripts/smoke-form-lifecycle.mjs
          else
            node scripts/smoke-form-lifecycle.mjs
          fi
      - name: Empacotar
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Instalar e testar DEB, AppImage e RPM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./release/*.deb
          dbus-run-session -- xvfb-run -a npm run test:packaged -- /opt/GCP-PDF/gcp-pdf deb
          mkdir -p .cache/appimage .cache/rpm
          APPIMAGE=$(realpath release/*.AppImage)
          cd .cache/appimage
          "$APPIMAGE" --appimage-extract > /dev/null
          cd ../..
          dbus-run-session -- xvfb-run -a npm run test:packaged -- .cache/appimage/squashfs-root/gcp-pdf AppImage
          bsdtar -xf release/*.rpm -C .cache/rpm
          dbus-run-session -- xvfb-run -a npm run test:packaged -- .cache/rpm/opt/GCP-PDF/gcp-pdf rpm
      - name: Diagnóstico de falha de inicialização Linux
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p evidence/packaged
          if ! command -v gdb >/dev/null; then sudo apt-get install -y gdb; fi
          export GCP_PDF_TEST_MODE=1
          export GCP_PDF_DATA_DIR="$PWD/.cache/linux-diagnostic-profile"
          export ELECTRON_ENABLE_LOGGING=1
          if [ -x /opt/GCP-PDF/gcp-pdf ]; then
            timeout -k 5s 25s dbus-run-session -- xvfb-run -a gdb --batch -ex run -ex 'thread apply all bt' --args /opt/GCP-PDF/gcp-pdf --no-sandbox > evidence/packaged/linux-native-backtrace.log 2>&1 || true
          else
            timeout -k 5s 25s dbus-run-session -- xvfb-run -a gdb --batch -ex run -ex 'thread apply all bt' --args "$(node -p "require('electron')")" --no-sandbox . > evidence/packaged/linux-native-backtrace.log 2>&1 || true
          fi
      - name: Montar DMG, copiar aplicativo e testar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/dmg .cache/installed .cache/zip
          hdiutil verify release/*.dmg
          hdiutil attach release/*.dmg -nobrowse -mountpoint "$PWD/.cache/dmg"
          ditto ".cache/dmg/GCP-PDF.app" ".cache/installed/GCP-PDF.app"
          hdiutil detach "$PWD/.cache/dmg"
          codesign --verify --deep --strict --verbose=2 ".cache/installed/GCP-PDF.app"
          npm run test:packaged -- ".cache/installed/GCP-PDF.app/Contents/MacOS/GCP-PDF" dmg
          ditto -x -k release/*.zip .cache/zip
          codesign --verify --deep --strict --verbose=2 ".cache/zip/GCP-PDF.app"
          npm run test:packaged -- ".cache/zip/GCP-PDF.app/Contents/MacOS/GCP-PDF" zip
      - name: Guardar instaladores validados
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.dmg
            release/*.zip
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: evidence/packaged/
          if-no-files-found: ignore
  publish:
    name: Publicar na release existente
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Conferir conjunto completo e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${RELEASE_TAG#v}
          for NAME in "GCP-PDF-$VERSION-linux-amd64.deb" "GCP-PDF-$VERSION-linux-x86_64.rpm" "GCP-PDF-$VERSION-linux-x86_64.AppImage" "GCP-PDF-$VERSION-macOS-arm64.dmg" "GCP-PDF-$VERSION-macOS-arm64.zip" "GCP-PDF-$VERSION-macOS-x64.dmg" "GCP-PDF-$VERSION-macOS-x64.zip"; do
            test -s "installers/$NAME"
          done
          gh release view "$RELEASE_TAG"
          cd installers
          sha256sum * > SHA256SUMS-linux-macOS.txt
          gh release upload "$RELEASE_TAG" ./*
